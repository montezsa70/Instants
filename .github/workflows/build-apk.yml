name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Locate (or unzip) the Android project
        id: locate
        shell: bash
        run: |
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            DIR="."
          elif ls *.zip >/dev/null 2>&1; then
            ZIP="$(ls *.zip | head -n1)"
            mkdir -p extracted && unzip -oq "$ZIP" -d extracted
            S="$(find extracted -name settings.gradle.kts | head -n1)"
            DIR="$(dirname "$S")"
          else
            S="$(find . -name settings.gradle.kts | head -n1)"
            DIR="$(dirname "$S")"
          fi
          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Auto-fix Haze version
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          sed -i 's|dev.chrisbanes.haze:haze:[0-9.]*|dev.chrisbanes.haze:haze:1.4.0|' app/build.gradle.kts
          grep haze app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: instants-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
