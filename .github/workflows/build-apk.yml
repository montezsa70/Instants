name: Build APK from zip

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip the Android project
        id: unzip
        run: |
          unzip -q -o instants-android.zip -d extracted
          SETTINGS=$(find extracted -maxdepth 3 -name 'settings.gradle.kts' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "No settings.gradle.kts found in the zip" >&2
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK 35
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        working-directory: ${{ steps.unzip.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: instants-debug-apk
          path: ${{ steps.unzip.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
